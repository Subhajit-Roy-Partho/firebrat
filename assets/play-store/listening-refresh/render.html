</style><main id="canvas"></main><script>

const cards={
1:intro('Your books. A new way in.','Free your eyes.<br><em>Let the story speak.</em>','Turn your own PDFs into narrated books.<br>Listen, follow along, or simply press play.')+'<img class="hero-art" src="sources/listening-world.png">'+'<div class="promo-note" style="left:72px;top:610px">Promo illustration · Reader screenshot is actual UI</div>'+phone('reader-playback.png','reader hero-reader')+wave(65,1040)+wave(820,1250)+fine('A world of listening, in your pocket.','Actual Firebrat reader · Public-domain sample'),

const id=new URLSearchParams(location.search).get('card')||'1';const c=document.getElementById('canvas');if(id==='feature'){document.documentElement.style.width='1024px';document.documentElement.style.height='500px';document.body.style.width='1024px';document.body.style.height='500px';c.className='feature';c.innerHTML='<img class="art" src="sources/listening-world.png"><div class="shade"></div>'+brand+'<h1>Free your eyes.<br><em>Enter a world<br>of listening.</em></h1><div class="tag">Your books. A new way to listen.</div><div class="promo-note">Promo illustration · Reader screenshot is actual UI</div>';}else{c.innerHTML=brand+`<div class="number">${id.padStart(2,'0')} / 06</div>`+cards[id];}document.title='Firebrat campaign '+id;
