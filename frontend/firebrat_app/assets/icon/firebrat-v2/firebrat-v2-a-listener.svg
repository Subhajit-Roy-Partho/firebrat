<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Firebrat v2-A — Listener (headphones)</title>
  <defs>
    <linearGradient id="v2abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4B56C6"/>
      <stop offset="1" stop-color="#1B2050"/>
    </linearGradient>
    <linearGradient id="v2apage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF7E6"/>
      <stop offset="1" stop-color="#FBD9A4"/>
    </linearGradient>
    <linearGradient id="v2abody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC66E"/>
      <stop offset="1" stop-color="#EE7A26"/>
    </linearGradient>
  </defs>

  <!-- full-bleed base (matches v1 baked rounding for the store icon) -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#v2abg)"/>
  <ellipse cx="512" cy="600" rx="310" ry="240" fill="#FFB25E" opacity="0.20"/>

  <!-- ground shadow -->
  <ellipse cx="512" cy="818" rx="270" ry="30" fill="#10144A" opacity="0.45"/>

  <!-- open book -->
  <g stroke-linejoin="round">
    <path d="M512 584 C 448 550, 348 534, 262 552 C 244 556, 234 568, 234 584 L234 754 C234 770, 244 780, 262 777 C 348 760, 448 774, 512 808 Z"
          fill="url(#v2apage)" stroke="#8A5A24" stroke-width="12"/>
    <path d="M512 584 C 576 550, 676 534, 762 552 C 780 556, 790 568, 790 584 L790 754 C790 770, 780 780, 762 777 C 676 760, 576 774, 512 808 Z"
          fill="url(#v2apage)" stroke="#8A5A24" stroke-width="12"/>
  </g>
  <path d="M512 584 L512 808" stroke="#8A5A24" stroke-width="12" stroke-linecap="round"/>
  <path d="M512 584 L512 808" stroke="#FFF6E0" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
  <!-- only 3 text lines per page: reads at 48px, v1 had 4 thin ones that blurred -->
  <g stroke="#E3B978" stroke-width="14" stroke-linecap="round" fill="none">
    <path d="M286 610 C 350 600, 410 604, 464 622"/>
    <path d="M284 652 C 348 642, 410 646, 466 664"/>
    <path d="M284 694 C 346 684, 406 688, 464 706"/>
    <path d="M560 622 C 614 604, 674 600, 738 610"/>
    <path d="M558 664 C 612 646, 674 642, 740 652"/>
    <path d="M560 706 C 614 688, 672 684, 738 694"/>
  </g>

  <!-- headphones: one bold band, two chunky pads -->
  <path d="M296 462 C 296 240, 728 240, 728 462" fill="none" stroke="#1A2258" stroke-width="48" stroke-linecap="round"/>
  <path d="M296 462 C 296 240, 728 240, 728 462" fill="none" stroke="#4B56C6" stroke-width="12" opacity="0.5" stroke-linecap="round"/>
  <rect x="246" y="432" width="100" height="148" rx="48" fill="#232C6E" stroke="#141A52" stroke-width="10"/>
  <rect x="678" y="432" width="100" height="148" rx="48" fill="#232C6E" stroke="#141A52" stroke-width="10"/>
  <rect x="266" y="456" width="60" height="100" rx="28" fill="#A9B6FF"/>
  <rect x="698" y="456" width="60" height="100" rx="28" fill="#A9B6FF"/>

  <!-- sound waves: the book is "speaking" to the right, bug leans in -->
  <g fill="none" stroke="#FFF3DE" stroke-linecap="round">
    <path d="M806 462 C 840 490, 840 548, 806 576" stroke-width="18"/>
    <path d="M834 436 C 880 474, 880 564, 834 602" stroke-width="18"/>
    <path d="M862 408 C 920 460, 920 578, 862 630" stroke-width="13" opacity="0.55"/>
    <path d="M218 480 C 192 502, 192 536, 218 558" stroke-width="14" opacity="0.5"/>
  </g>

  <!-- firebrat: head RIGHT, tilted toward the waves -->
  <g transform="translate(498 372) rotate(6)">
    <g stroke="#A34E12" stroke-width="10" stroke-linecap="round" fill="none">
      <path d="M-118 6 C -150 -4, -172 -18, -186 -38"/>
      <path d="M-120 22 C -152 22, -178 18, -198 8"/>
      <path d="M-116 38 C -146 46, -168 56, -182 72"/>
    </g>
    <path d="M-150 -6 C -150 -52, -90 -80, -10 -78 C 70 -76, 140 -50, 168 -6 C 184 18, 168 40, 128 44 C 60 52, -40 52, -104 40 C -140 32, -152 20, -150 -6 Z"
          fill="url(#v2abody)" stroke="#A34E12" stroke-width="10" stroke-linejoin="round"/>
    <path d="M-120 22 C -90 38, -20 44, 50 38 C 90 34, 120 26, 140 14 C 100 24, 40 30, -20 28 C -70 26, -105 24, -120 22 Z"
          fill="#FFE3AC" opacity="0.9"/>
    <g stroke="#A34E12" stroke-width="7" opacity="0.65" fill="none">
      <path d="M-84 -60 C -88 -34, -86 -8, -78 16"/>
      <path d="M-36 -68 C -40 -40, -38 -10, -28 20"/>
      <path d="M16 -62 C 12 -36, 14 -6, 26 24"/>
    </g>
    <!-- antennae perked RIGHT toward the sound -->
    <g stroke="#A34E12" stroke-width="10" stroke-linecap="round" fill="none">
      <path d="M150 -28 C 178 -58, 196 -84, 202 -118"/>
      <path d="M128 -40 C 148 -74, 156 -104, 154 -136"/>
    </g>
    <circle cx="202" cy="-122" r="11" fill="#FFD08A" stroke="#A34E12" stroke-width="5"/>
    <circle cx="154" cy="-140" r="11" fill="#FFD08A" stroke="#A34E12" stroke-width="5"/>
    <!-- face: solid dot eyes read at 48px where v1's closed ^^ strokes vanished -->
    <circle cx="108" cy="-12" r="9" fill="#3A2410"/>
    <circle cx="140" cy="-10" r="9" fill="#3A2410"/>
    <ellipse cx="92" cy="8" rx="13" ry="9" fill="#E86A4A" opacity="0.45"/>
    <ellipse cx="156" cy="6" rx="13" ry="9" fill="#E86A4A" opacity="0.45"/>
    <path d="M110 12 C 120 24, 138 26, 148 14" fill="none" stroke="#3A2410" stroke-width="7" stroke-linecap="round"/>
    <path d="M40 44 C 30 62, 26 76, 30 90" fill="none" stroke="#A34E12" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- single sparkle, top-left balance -->
  <path d="M330 184 l10 18 18 10 -18 10 -10 18 -10 -18 -18 -10 18 -10 z" fill="white" opacity="0.9"/>
  <path d="M690 168 l7 12 12 7 -12 7 -7 12 -7 -12 -12 -7 12 -7 z" fill="white" opacity="0.5"/>
</svg>
