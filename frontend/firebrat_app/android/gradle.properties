# This build runs in a SLURM allocation capped at 6GB total RAM — keep the
# Gradle daemon well under that (Xmx8G caused an instant OOM kill here).
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m
org.gradle.daemon=false
android.useAndroidX=true
android.useAndroidX=true
