# This build runs in a SLURM allocation capped at 6GB total RAM, shared with
# whatever else is running in the session — keep the Gradle daemon well
# under that (Xmx8G caused an instant OOM kill here; even Xmx2G can lose a
# race against a concurrent Python process). Trimmed further to leave
# headroom when other memory-heavy stages might be running at the same time.
org.gradle.jvmargs=-Xmx1200m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=192m
org.gradle.daemon=false
android.useAndroidX=true
