# Firebrat server, three ways to run it — pick one profile:
#
#   docker compose --profile cpu up      # all-in-one, runs anywhere, slower conversions
#   docker compose --profile gpu up      # all-in-one, needs nvidia-container-toolkit + a GPU
#   docker compose --profile api up      # API/job-queue only, needs conda envs on the host
#
# All three publish the API on http://localhost:8000 and persist book
# packages/uploads/the job database in the `firebrat-data` volume, so
# `docker compose down` + `up` again picks up right where it left off.
services:
  firebrat-cpu:
    image: subhajitroy/firebrat:cpu
    build:
      context: .
      dockerfile: backend/docker/Dockerfile
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
    profiles: ["cpu"]
    ports:
      - "8000:8000"
    volumes:
      - firebrat-data:/data
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - MODEL_API_KEY=${MODEL_API_KEY:-}
      - FIREBRAT_SPARK_MODEL=${FIREBRAT_SPARK_MODEL:-}

  firebrat-gpu:
    image: subhajitroy/firebrat:gpu
    build:
      context: .
      dockerfile: backend/docker/Dockerfile
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu121
    profiles: ["gpu"]
    ports:
      - "8000:8000"
    volumes:
      - firebrat-data:/data
      # Local-LLM weights (host dir with the HF snapshot, or empty — the
      # entrypoint auto-downloads LOCAL_MODEL_PRESET when empty).
      - firebrat-models:/models
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - MODEL_API_KEY=${MODEL_API_KEY:-}
      - FIREBRAT_SPARK_MODEL=${FIREBRAT_SPARK_MODEL:-}
      # Stage-2 provider: nanogpt (default, needs MODEL_API_KEY) or local
      # (on-container GPU model; needs --gpus, picked automatically by run.sh).
      - LLM_PROVIDER=${LLM_PROVIDER:-nanogpt}
      - LOCAL_MODEL_PRESET=${LOCAL_MODEL_PRESET:-qwen3-4b}
      - LOCAL_MODEL_DIR=${LOCAL_MODEL_DIR:-/models}
      - LOCAL_MAX_SEQ_LEN=${LOCAL_MAX_SEQ_LEN:-16384}
      - FIREBRAT_MAX_CONCURRENT_JOBS=${FIREBRAT_MAX_CONCURRENT_JOBS:-1}
      - FIREBRAT_CHUNK_PAGES=${FIREBRAT_CHUNK_PAGES:-10}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  firebrat-api:
    image: subhajitroy/firebrat:api
    build:
      context: .
      dockerfile: backend/docker/Dockerfile.api
    profiles: ["api"]
    ports:
      - "8000:8000"
    volumes:
      - firebrat-data:/data
      # Point these at your existing conda envs (see AGENTS.md) so this
      # thin image can shell out to them:
      # - /path/to/conda-envs:/envs:ro
    environment:
      - FIREBRAT_EXTRACT_PY=${FIREBRAT_EXTRACT_PY:-}
      - FIREBRAT_TTS_PY=${FIREBRAT_TTS_PY:-}
      - FIREBRAT_CONVERT_PY=${FIREBRAT_CONVERT_PY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - MODEL_API_KEY=${MODEL_API_KEY:-}

volumes:
  firebrat-data:
  firebrat-models:
