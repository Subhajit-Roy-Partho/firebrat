name: Flutter release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Build flavor'
        required: false
        default: 'apk'
        type: choice
        options: [apk, appbundle, both]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: frontend/firebrat_app
        run: flutter pub get

      - name: Analyze
        working-directory: frontend/firebrat_app
        run: flutter analyze

      - name: Tests
        working-directory: frontend/firebrat_app
        run: flutter test

      - name: Build APK
        if: inputs.flavor == 'apk' || inputs.flavor == 'both' || github.event_name == 'push'
        working-directory: frontend/firebrat_app
        run: flutter build apk --release

      - name: Build App Bundle
        if: inputs.flavor == 'appbundle' || inputs.flavor == 'both'
        working-directory: frontend/firebrat_app
        run: flutter build appbundle --release

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firebrat-apk
          path: frontend/firebrat_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn

      - name: Upload AAB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firebrat-aab
          path: frontend/firebrat_app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: warn

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            frontend/firebrat_app/build/app/outputs/flutter-apk/app-release.apk
            frontend/firebrat_app/build/app/outputs/bundle/release/app-release.aab
          generate_release_notes: true
