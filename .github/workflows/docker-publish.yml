name: Publish Docker images

# Builds and pushes all three Firebrat images to Docker Hub. Runs on
# GitHub's hosted runners, which have Docker preinstalled — this is what
# actually builds the images; no local Docker install is required by
# anyone maintaining this repo.
#
# One-time setup: add two repo secrets (Settings -> Secrets and variables ->
# Actions) — DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub access
# token, not your password: hub.docker.com -> Account Settings -> Security
# -> New Access Token).

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - variant: cpu
            dockerfile: backend/docker/Dockerfile
            build_args: TORCH_INDEX_URL=https://download.pytorch.org/whl/cpu
            extra_tag: "" # cpu is not also `latest`
          - variant: gpu
            dockerfile: backend/docker/Dockerfile
            build_args: TORCH_INDEX_URL=https://download.pytorch.org/whl/cu121
            extra_tag: latest
          - variant: api
            dockerfile: backend/docker/Dockerfile.api
            build_args: ""
            extra_tag: ""
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build tag list
        id: tags
        run: |
          tags="subhajitroy/firebrat:${{ matrix.variant }}"
          if [ -n "${{ matrix.extra_tag }}" ]; then
            tags="$tags,subhajitroy/firebrat:${{ matrix.extra_tag }}"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
