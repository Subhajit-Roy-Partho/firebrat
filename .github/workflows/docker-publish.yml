name: Publish Docker images

# Builds and pushes all three Firebrat images to Docker Hub. Runs on
# GitHub's hosted runners, which have Docker preinstalled — this is what
# actually builds the images; no local Docker install is required by
# anyone maintaining this repo.
#
# One-time setup: add two repo secrets (Settings -> Secrets and variables ->
# Actions) — DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub access
# token, not your password: hub.docker.com -> Account Settings -> Security
# -> New Access Token).

on:
  push:
    branches: [main]
    tags: ["v*", "server-v*"]
  workflow_dispatch:
    inputs:
      desktop_only:
        description: Rebuild only desktop images using already published backend images
        type: boolean
        default: false
      release_tag:
        description: Existing source/release tag (for desktop-only recovery)
        type: string
        default: ''
      variant:
        description: Desktop variant to rebuild
        type: choice
        options: [both, cpu, gpu]
        default: both

jobs:
  build-and-push:
    if: ${{ !inputs.desktop_only }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - variant: cpu
            dockerfile: backend/docker/Dockerfile
            build_args: TORCH_INDEX_URL=https://download.pytorch.org/whl/cpu
            extra_tag: "" # cpu is not also `latest`
          - variant: gpu
            dockerfile: backend/docker/Dockerfile
            build_args: |
              TORCH_INDEX_URL=https://download.pytorch.org/whl/cu128
              TTS_TORCH_INDEX_URL=https://download.pytorch.org/whl/cu124
            extra_tag: latest
          - variant: api
            dockerfile: backend/docker/Dockerfile.api
            build_args: ""
            extra_tag: ""
    steps:
      - uses: actions/checkout@v4

      - name: Free runner space for separate extraction and speech CUDA runtimes
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build tag list
        id: tags
        run: |
          tags="subhajitroy/firebrat:${{ matrix.variant }}"
          if [ -n "${{ matrix.extra_tag }}" ]; then
            tags="$tags,subhajitroy/firebrat:${{ matrix.extra_tag }}"
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tags="$tags,subhajitroy/firebrat:${GITHUB_REF_NAME}-${{ matrix.variant }}"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

  desktop:
    needs: build-and-push
    if: ${{ always() && (needs.build-and-push.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.desktop_only)) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.variant == 'gpu' && '["gpu"]' || inputs.variant == 'cpu' && '["cpu"]' || '["cpu","gpu"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Free runner space for separate extraction and speech CUDA runtimes
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: docker/setup-buildx-action@v3
        id: buildx
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Choose matching backend and desktop tags
        id: tags
        env:
          REQUESTED_RELEASE: ${{ inputs.release_tag }}
          VARIANT: ${{ matrix.variant }}
        shell: bash
        run: |
          release="$REQUESTED_RELEASE"
          if [[ -z "$release" && "$GITHUB_REF" == refs/tags/* ]]; then release="$GITHUB_REF_NAME"; fi
          base="subhajitroy/firebrat:$VARIANT"
          tags="subhajitroy/firebrat:desktop-$VARIANT"
          if [[ -n "$release" ]]; then
            [[ "$release" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]] || exit 1
            base="subhajitroy/firebrat:$release-$VARIANT"
            tags="$tags,subhajitroy/firebrat:$release-desktop-$VARIANT"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - name: Build temporary image without duplicating it in the runner Docker store
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/docker/Dockerfile.desktop
          build-args: BASE_IMAGE=${{ steps.tags.outputs.base }}
          push: true
          tags: subhajitroy/firebrat:staging-${{ github.run_id }}-${{ matrix.variant }}
          cache-from: type=gha,scope=desktop-${{ matrix.variant }}
      - name: Free build cache before pulling image for startup test
        env:
          BUILDER: ${{ steps.buildx.outputs.name }}
        run: docker buildx rm "$BUILDER"
      - name: Test published temporary image before promoting final tags
        env:
          IMAGE: subhajitroy/firebrat:staging-${{ github.run_id }}-${{ matrix.variant }}
        run: |
          docker run --rm --entrypoint /opt/venvs/serve/bin/python "$IMAGE" /app/desktop/docker-smoke.py
          docker run --rm --entrypoint /usr/bin/ollama "$IMAGE" --version
      - name: Promote tested image to final Docker Hub tags
        env:
          IMAGE: subhajitroy/firebrat:staging-${{ github.run_id }}-${{ matrix.variant }}
          TAGS: ${{ steps.tags.outputs.tags }}
        shell: bash
        run: |
          IFS=',' read -ra tags <<< "$TAGS"
          args=()
          for tag in "${tags[@]}"; do args+=(-t "$tag"); done
          docker buildx imagetools create "${args[@]}" "$IMAGE"

  desktop-release:
    needs: desktop
    if: ${{ always() && needs.desktop.result == 'success' && (startsWith(github.ref, 'refs/tags/server-v') || startsWith(inputs.release_tag, 'server-v')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Attach Docker launcher, guide and image links to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          FIREBRAT_RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: bash .github/scripts/publish-server-docker-release.sh
